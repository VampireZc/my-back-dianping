server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api
spring:
  application:
    name: my-back-dianping
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://192.168.64.4:3306/hmdp
    username: root
    password: 123456
  jackson:
    default-property-inclusion: non_null

  data:
    redis:
      database: 8
      host: localhost
      port: 6379
      password: 123456

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

logging:
  level:
    com.zc.mybackdianping: debug

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启表字段驼峰命名转换
    map-underscore-to-camel-case: true